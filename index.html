<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Home Screen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --theme-accent: #38bdf8;
            --theme-glow: rgba(56, 189, 248, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 2s ease-in-out;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.55);
            z-index: 0;
        }

        .top-bar, .main-content, .bottom-bar {
            position: relative;
            z-index: 1;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .greeting-container { display: flex; flex-direction: column; }

        .greeting-text {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--theme-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            transition: color 1.5s ease;
        }

        .date-container {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        .weather-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(15, 23, 42, 0.7);
            padding: 15px 25px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .weather-temp { font-size: 2.5rem; font-weight: 800; }
        .weather-desc { font-size: 1.2rem; color: #cbd5e1; }

        .main-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin: auto 0;
            gap: 40px;
        }

        .clock-container { text-align: left; }

        .time {
            font-size: 8.5rem;
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .seconds {
            font-size: 3rem;
            font-weight: 400;
            color: #cbd5e1;
            margin-left: 10px;
        }

        .quote-box {
            margin-top: 25px;
            max-width: 550px;
            background: rgba(15, 23, 42, 0.6);
            padding: 16px 22px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .quote-text { font-size: 1.1rem; font-style: italic; color: #f1f5f9; line-height: 1.4; }
        .quote-author { font-size: 0.9rem; color: #94a3b8; margin-top: 6px; text-align: right; font-weight: 600; }

        .calendar-container {
            background: rgba(15, 23, 42, 0.75);
            padding: 24px;
            border-radius: 20px;
            backdrop-filter: blur(16px);
            border: 2px solid var(--theme-accent);
            width: 480px;
            height: 340px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 35px var(--theme-glow);
            transition: all 1.5s ease;
        }

        .calendar-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--theme-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: color 1.5s ease;
        }

        .events-list {
            list-style: none;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .event-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 4px solid var(--theme-accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 1.5s ease;
        }

        .event-info { display: flex; flex-direction: column; }
        .event-name { font-size: 1.1rem; font-weight: 700; color: #ffffff; }
        .event-details { font-size: 0.85rem; color: #cbd5e1; margin-top: 3px; }

        .event-category-badge {
            font-size: 0.7rem;
            background: var(--theme-accent);
            color: #0f172a;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            transition: background-color 1.5s ease;
        }

        .no-events {
            color: #94a3b8;
            font-style: italic;
            font-size: 0.95rem;
            text-align: center;
            margin-top: 50px;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            color: #e2e8f0;
            font-size: 1.05rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .news-ticker {
            flex: 1;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .news-label {
            background: var(--theme-accent);
            color: #0f172a;
            font-weight: 800;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 1.5s ease;
        }

        .news-text { color: #f1f5f9; font-weight: 500; transition: opacity 0.5s ease; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="top-bar">
        <div class="greeting-container">
            <div class="greeting-text" id="greeting-display">Good Day</div>
            <div class="date-container" id="date-display">Loading date...</div>
        </div>
        <div class="weather-container">
            <div class="weather-temp" id="weather-temp">--°F</div>
            <div class="weather-desc" id="weather-desc">Loading weather...</div>
        </div>
    </div>

    <div class="main-content">
        <div class="clock-container">
            <div class="time">
                <span id="time-display">00:00</span><span class="seconds" id="sec-display">00</span>
            </div>
            
            <div class="quote-box">
                <div class="quote-text" id="quote-text">"Nature does not hurry, yet everything is accomplished."</div>
                <div class="quote-author" id="quote-author">— Lao Tzu</div>
            </div>
        </div>

        <div class="calendar-container">
            <div class="calendar-title">
                <span>Today's Schedule</span>
                <span id="today-date-tag" style="font-size: 0.85rem; font-weight: 500; opacity: 0.8;"></span>
            </div>
            <ul class="events-list" id="events-list">
                <div class="no-events">No events scheduled for today.</div>
            </ul>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="news-ticker">
            <span class="news-label">Updates</span>
            <span class="news-text" id="news-text">Loading headlines...</span>
        </div>
    </div>

    <script>
        const themes = [
            { url: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1920&q=80", color: "#38bdf8", glow: "rgba(56, 189, 248, 0.35)" },
            { url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80", color: "#34d399", glow: "rgba(52, 211, 153, 0.35)" },
            { url: "https://images.unsplash.com/photo-1483921020237-2ff51e8e4b22?auto=format&fit=crop&w=1920&q=80", color: "#a78bfa", glow: "rgba(167, 139, 250, 0.35)" },
            { url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80", color: "#fbbf24", glow: "rgba(251, 191, 36, 0.35)" },
            { url: "https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=1920&q=80", color: "#f472b6", glow: "rgba(244, 114, 182, 0.35)" }
        ];

        const quotes = [
            { text: "Nature does not hurry, yet everything is accomplished.", author: "Lao Tzu" },
            { text: "Keep your face always toward the sunshine—and shadows will fall behind you.", author: "Walt Whitman" },
            { text: "Small daily improvements over time lead to stunning results.", author: "Robin Sharma" }
        ];

        const newsHeadlines = [
            "Welcome to your personal TV Dashboard!",
            "Weather refreshed automatically every 1 minute.",
            "Background themes rotate smoothly every 2 minutes.",
            "Calendar syncs in real-time when changes are made."
        ];

        let currentThemeIndex = 0;
        let currentNewsIndex = 0;

        function rotateTheme() {
            const activeTheme = themes[currentThemeIndex];
            const img = new Image();
            img.src = activeTheme.url;
            img.onload = () => {
                document.body.style.backgroundImage = `url('${activeTheme.url}')`;
                document.documentElement.style.setProperty('--theme-accent', activeTheme.color);
                document.documentElement.style.setProperty('--theme-glow', activeTheme.glow);
            };
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
        }

        rotateTheme();
        setInterval(rotateTheme, 2 * 60 * 1000);

        function updateDateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('time-display').textContent = `${String(hours).padStart(2, '0')}:${minutes}`;
            document.getElementById('sec-display').textContent = seconds;

            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', options);

            let greeting = "Good Evening";
            if (hours >= 5 && hours < 12) greeting = "Good Morning";
            else if (hours >= 12 && hours < 18) greeting = "Good Afternoon";
            document.getElementById('greeting-display').textContent = greeting;
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        function displayRandomQuote() {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote-text').textContent = `"${randomQuote.text}"`;
            document.getElementById('quote-author').textContent = `— ${randomQuote.author}`;
        }
        displayRandomQuote();

        function rotateNews() {
            const newsElem = document.getElementById('news-text');
            newsElem.style.opacity = 0;
            setTimeout(() => {
                newsElem.textContent = newsHeadlines[currentNewsIndex];
                newsElem.style.opacity = 1;
                currentNewsIndex = (currentNewsIndex + 1) % newsHeadlines.length;
            }, 500);
        }
        rotateNews();
        setInterval(rotateNews, 8000);

        function getTodayKey() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function loadCalendarEvents() {
            const events = JSON.parse(localStorage.getItem('tv_dashboard_events')) || [];
            const container = document.getElementById('events-list');
            const todayKey = getTodayKey();

            document.getElementById('today-date-tag').textContent = todayKey;

            const todayEvents = events.filter(evt => evt.date === todayKey);

            if (todayEvents.length === 0) {
                container.innerHTML = '<div class="no-events">No events scheduled for today.</div>';
                return;
            }

            container.innerHTML = todayEvents.map(evt => `
                <li class="event-card">
                    <div class="event-info">
                        <span class="event-name">${evt.title}</span>
                        <span class="event-details">
                            ${evt.time ? 'Starts at ' + evt.time : 'All Day'} • (${evt.durationText || (evt.durationMinutes + ' mins')})
                        </span>
                    </div>
                    <span class="event-category-badge">${evt.category || 'General'}</span>
                </li>
            `).join('');
        }

        loadCalendarEvents();
        window.addEventListener('storage', loadCalendarEvents);

        const LATITUDE = 40.7128;
        const LONGITUDE = -74.0060;

        async function fetchWeather() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`);
                if (!response.ok) throw new Error('Network failure');
                
                const data = await response.json();
                const temp = Math.round(data.current.temperature_2m);
                const weatherCode = data.current.weather_code;
                
                document.getElementById('weather-temp').textContent = `${temp}°F`;
                document.getElementById('weather-desc').textContent = getWeatherDescription(weatherCode);
            } catch (error) {
                document.getElementById('weather-desc').textContent = 'Weather unavailable';
            }
        }

        function getWeatherDescription(code) {
            const codes = {
                0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
                45: 'Foggy', 48: 'Rime fog', 51: 'Light drizzle', 53: 'Moderate drizzle',
                55: 'Dense drizzle', 61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
                71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow',
                80: 'Slight rain showers', 81: 'Moderate rain showers', 82: 'Violent rain showers',
                95: 'Thunderstorm', 96: 'Thunderstorm with hail', 99: 'Heavy thunderstorm'
            };
            return codes[code] || 'Fair';
        }

        fetchWeather();
        setInterval(fetchWeather, 1 * 60 * 1000);
    </script>
</body>
</html>
